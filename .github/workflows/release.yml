name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 glibc (baseline glibc 2.28 via zig, Cross.toml)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            use_cross: true

          # Linux x86_64 musl (static standalone / Alpine)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true

          # Linux aarch64 glibc (baseline glibc 2.28 via zig, Cross.toml)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            use_cross: true

          # Linux aarch64 musl (static ARM64 / OpenWrt / ImmortalWrt)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true

          # macOS Apple Silicon (ARM64)
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

          # macOS Intel (x86_64)
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false

          # Windows i686
          - target: i686-pc-windows-msvc
            os: windows-latest
            use_cross: false

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

          # Windows ARM64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if required)
        if: matrix.use_cross
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cross

      - name: Build target (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build target (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          TAG="${GITHUB_REF_NAME:-latest}"
          ARCHIVE_NAME="rsupervisord-${TAG}-${{ matrix.target }}"
          BIN_DIR="target/${{ matrix.target }}/release"
          mkdir -p "${ARCHIVE_NAME}"
          cp "${BIN_DIR}/supervisord" "${BIN_DIR}/supervisorctl" "${ARCHIVE_NAME}/"
          cp README.md README_zh.md LICENSE config-example.yaml "${ARCHIVE_NAME}/"
          tar -cJf "${ARCHIVE_NAME}.tar.xz" "${ARCHIVE_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}.tar.xz" > "${ARCHIVE_NAME}.tar.xz.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE_NAME}.tar.xz" > "${ARCHIVE_NAME}.tar.xz.sha256"
          fi

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          $ArchiveName = "rsupervisord-${Tag}-${{ matrix.target }}"
          $BinDir = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path $ArchiveName
          Copy-Item "$BinDir/supervisord.exe", "$BinDir/supervisorctl.exe" -Destination $ArchiveName/
          Copy-Item README.md, README_zh.md, LICENSE, config-example.yaml -Destination $ArchiveName/
          Compress-Archive -Path "$ArchiveName/*" -DestinationPath "${ArchiveName}.zip" -Force
          Remove-Item -Recurse -Force $ArchiveName
          $Hash = (Get-FileHash -Algorithm SHA256 "${ArchiveName}.zip").Hash.ToLower()
          "$Hash  ${ArchiveName}.zip" | Out-File -Encoding ascii "${ArchiveName}.zip.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            rsupervisord-*.*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate consolidated checksums
        working-directory: dist
        run: |
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.xz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
