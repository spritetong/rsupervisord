; ---------------------------------------------------------------------------
; rsupervisord compatibility harness - comprehensive stock supervisord config
;
; Golden-oracle configuration exercised by compat/tests/*. It intentionally
; uses the standard INI section classes and a wide spread of fields so that
; both the XML-RPC and the supervisorctl (CLI) suites cover real behavior.
;
; Run against stock Python Supervisor 4.2.5 (see compat/bootstrap.sh).
; All paths are relative to %(here)s so a copy of conf/ can be launched from
; any temporary directory.
; ---------------------------------------------------------------------------

[unix_http_server]
file=%(here)s/run/supervisor.sock
chmod=0700
username=ctluser
password=ctlpass

[inet_http_server]
port=127.0.0.1:9011
username=rpcuser
password=rpcpass

[supervisord]
logfile=%(here)s/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3
loglevel=info
pidfile=%(here)s/run/supervisord.pid
childlogdir=%(here)s/logs
identifier=rsupervisord-compat
nocleanup=true
minfds=1024
minprocs=200
umask=022
environment=COMPAT_TAG="alpha",COMPAT_MODE="oracle"

[supervisorctl]
serverurl=unix://%(here)s/run/supervisor.sock
username=ctluser
password=ctlpass

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; --- one-shot program: starts, exits 0, stops itself -----------------------
[program:echo]
command=/bin/sh -c "echo hello-from-echo; exit 0"
autostart=false
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=%(here)s/logs/echo.out.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

; --- long-running program: HUP-tolerant, emits stdout + stderr -------------
[program:ticker]
command=/bin/sh -c "trap '' HUP; i=0; while true; do i=$((i+1)); echo tick $i; echo err $i 1>&2; sleep 1; done"
directory=%(here)s
priority=100
autostart=true
autorestart=unexpected
startsecs=1
startretries=3
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=%(here)s/logs/ticker.out.log
stderr_logfile=%(here)s/logs/ticker.err.log
stdout_events_enabled=true
stderr_events_enabled=true
redirect_stderr=false

; --- stdin/echo program used by sendProcessStdin ---------------------------
[program:catx]
command=/bin/cat
autostart=true
autorestart=false
startsecs=1

; --- numprocs program: per-process name + environment expansion ------------
[program:worker]
command=/bin/sh -c "echo worker=$PROC tag=$TAG; while true; do sleep 1; done"
process_name=%(program_name)s_%(process_num)02d
numprocs=2
numprocs_start=0
priority=200
autostart=true
autorestart=unexpected
startsecs=1
environment=PROC="%(process_num)02d",TAG="%(ENV_COMPAT_TAG)s"

; --- flaky program: dies before startsecs -> BACKOFF -> FATAL --------------
[program:flaky]
command=/bin/sh -c "sleep 0.3; exit 3"
autostart=false
autorestart=false
startsecs=2
startretries=1

; --- unspawnable program: exercises NOT_EXECUTABLE / SPAWN_ERROR -----------
[program:nosuch]
command=/nonexistent/binary --nope
autostart=false
autorestart=false

; --- heterogeneous group over two of the programs above --------------------
[group:services]
programs=ticker,catx
priority=999

; --- event listener: READY/RESULT handshake, drains state + tick events ----
; command writes every received envelope (JSON per line) to logs/events.log
[eventlistener:listener]
command=python3 %(here)s/listener.py %(here)s/logs/events.log
events=PROCESS_STATE,PROCESS_LOG,TICK_5,REMOTE_COMMUNICATION
autostart=true

; --- deliberately protocol-violating listener: exercises the UNKNOWN state --
[eventlistener:badlistener]
command=python3 %(here)s/badlistener.py
events=PROCESS_LOG,TICK_5
buffer_size=10
autostart=true

; --- config include demo ---------------------------------------------------
[include]
files = conf.d/*.ini
