[package]
name = "rsupervisord"
version = "0.1.0"
edition = "2024"
authors = ["Sprite Tong <spritetong@gmail.com>"]
repository = "https://github.com/spritetong/rsupervisord"
license = "MIT"
description = "High-performance, memory-safe, asynchronous process supervisor with DAG orchestration, zero-downtime hot reload, and embedded Web UI"
readme = "README.md"

[[bin]]
name = "rsupervisord"
path = "src/main.rs"

[[bin]]
name = "rsupervisorctl"
path = "src/bin/rsupervisorctl.rs"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
opt-level = "z"
debug = 0
strip = true

[dependencies]
# Async runtime and utilities
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Synchronization primitives & lifecycle guards
parking_lot = "0.12"
scopeguard = "1.2"

# Error handling
thiserror = "2"
anyhow = "1"

# Graph algorithms and DAG
petgraph = "0.8"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
file-rotate = "0.8"
shell-words = "1"

# CLI and formatting
clap = { version = "4", features = ["derive"] }
tabled = { version = "0.22", features = ["ansi"] }
colored = "3"

# Web server and networking
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
rust-embed = "8.5"
mime_guess = "2.0"

# Platform abstractions
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = [
    "process",
    "signal",
    "user",
    "fs",
    "socket",
] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uds_windows = "1"
windows-service = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
