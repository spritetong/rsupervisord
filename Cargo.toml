[package]
name = "rsupervisord"
version = "1.0.0"
edition = "2024"
authors = ["Sprite Tong <spritetong@gmail.com>"]
repository = "https://github.com/spritetong/rsupervisord"
license = "MPL-2.0"
description = "High-performance, memory-safe, asynchronous process supervisor with DAG orchestration, zero-downtime hot reload, and embedded Web UI"
readme = "README.md"

[[bin]]
name = "supervisord"
path = "src/main.rs"

[[bin]]
name = "supervisorctl"
path = "src/bin/supervisorctl.rs"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
opt-level = "z"
debug = 0
strip = true

[dependencies]
# Async runtime and utilities
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures-util = "0.3"
bytes = "1"
croner = "4.0"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Synchronization primitives & lifecycle guards
parking_lot = "0.12"
scopeguard = "1.2"

# Error handling
thiserror = "2"
anyhow = "1"

# Graph algorithms and DAG
petgraph = "0.8"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
shell-words = "1"
which = "8"

# CLI and formatting
clap = { version = "4", features = ["derive"] }
tabled = { version = "0.22", features = ["ansi"] }
colored = "3"

# Web server and networking
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
rust-embed = "8.5"
mime_guess = "2.0"
base64 = "0.23"
sha1 = "0.11"
getrandom = "0.4"
strum = { version = "0.28.0", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["full"] }
dashmap = "6.2.1"
ahash = "0.8.12"
smallvec = "1.16.1"
paste = "1"
smart-default = "0.7"
compact_str = { version = "0.10.0", features = ["serde"] }
notify = "8"
quick-xml = "0.42.0"
heck = "0.5"

# Platform abstractions
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = [
    "process",
    "signal",
    "user",
    "fs",
    "socket",
    "hostname",
    "resource",
] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uds_windows = "1"
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
