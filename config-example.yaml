# ==============================================================================
# rsupervisord Configuration Example (config-example.yaml)
#
# Production-grade process supervisor with high concurrency, zero-abort safety,
# DAG topology scheduling, zero-downtime hot reload, and embedded Web UI.
#
# Environment variables in the format ${VAR} or ${VAR:-default} will be automatically
# expanded upon loading.
# ==============================================================================

# Number of worker threads for Tokio async runtime.
# If omitted or null, defaults to the number of available CPU cores.
# Set to 1 to enable single-threaded `current_thread` runtime for minimal memory footprint.
# Can also be overridden via CLI (--worker-threads <N>) or env var TOKIO_WORKER_THREADS.
worker_threads: 2

# ------------------------------------------------------------------------------
# 1. Daemon Server Engine Settings
# ------------------------------------------------------------------------------
server:
  # Local IPC socket path (Unix Domain Socket on Unix, Named Pipe / UDS on Windows)
  # Default on Unix: /var/run/supervisord.sock (or /tmp/supervisord.sock)
  # Default on Windows: \\.\pipe\supervisord (or C:/run/supervisord.sock for Caddy UDS)
  uds_path: "${SUPERVISORD_IPC_PATH:-/var/run/supervisord.sock}"

  # Optional TCP HTTP listener for the Embedded Web UI and REST API.
  # If omitted, server will only listen on the local IPC socket.
  http_bind: "127.0.0.1:8500"

  # Optional Bearer Token authentication for the REST API, XML-RPC, SSE, and Web UI.
  # Applied on BOTH TCP and IPC listeners. If username/password are also set,
  # either credential is accepted (OR semantics) — identical to stock Supervisor
  # behavior when only basic credentials exist (.ini never sets auth_token).
  # Leave blank or omit if authentication is not required for local access.
  auth_token: "${SUPERVISOR_AUTH_TOKEN:-}"

  # Optional HTTP Basic Authentication (Supervisor compatible).
  # TCP listener uses username/password; IPC uses uds_username/uds_password
  # (auto-filled from this pair when omitted).
  # The Web UI shows a login modal and stores an HttpOnly session cookie —
  # credentials are never saved in the browser.
  # Supports cleartext password or SHA-1 hash prefixed with {SHA}
  # e.g. "{SHA}82ab876d1387bfafe46cc1c8a2ef074eae50cb1d"
  username: "${SUPERVISOR_HTTP_USER:-}"
  password: "${SUPERVISOR_HTTP_PASSWORD:-}"

  # When true (default), relative paths are absolutized against the config file directory.
  # For INI (Python-compat) configs this is forced to false (bare relative paths resolve against daemon CWD).
  path_translation: true

  # When true, allows non-elevated (non-root on Unix, non-admin on Windows) callers to connect
  # via local IPC when the daemon is running elevated. (default: false)
  # For INI (Python-compat) configs this is forced to true (no elevation gate; socket file permissions only).
  allow_unelevated: false

  # Optional IPC endpoint permission mode (alias: chmod). Quoted octal string.
  # Valid values: "0700", "0770", "0777" (accepts "0700" / "0o700" / "700").
  # Defaults: "0777" if allow_unelevated=true; otherwise "0700" on Unix or "0770" on Windows.
  # uds_chmod: "0700"

# ------------------------------------------------------------------------------
# 2. Daemon Logging Settings
# ------------------------------------------------------------------------------
logging:
  # Set to false or loglevel "off" to completely disable daemon logging output.
  enabled: true

  # Daemon self-log file destination. If omitted, logs to stdout/stderr.
  file: "logs/supervisord.log"

  # Log verbosity level: trace, debug, info, warn, error (default: info)
  level: "info"

  # Maximum log file size before rotation (e.g. 10MB, 20MB, 100MB)
  max_bytes: "20MB"

  # Number of historical rotated backup files to retain
  backups: 5

# ------------------------------------------------------------------------------
# 3. Process Resource Metrics Monitoring (CPU / Memory)
# ------------------------------------------------------------------------------
metrics:
  # Enable resource utilization metrics collection (default: true)
  enabled: true

  # Idle timeout in seconds before pausing metrics collection when no CLI or Web UI
  # connection is actively connected (default: 30s).
  # Set to 0 to keep continuous background monitoring indefinitely.
  idle_timeout_secs: 30

  # Metrics refresh interval in seconds when clients are active (default: 2s)
  interval_secs: 2

# ------------------------------------------------------------------------------
# 3. Global Default Program Template
# ------------------------------------------------------------------------------
# Default values applied to any program that does not explicitly override them.
program_defaults:
  # Automatically start this program when the daemon launches (default: true)
  autostart: true

  # Auto-restart policy:
  #   - unexpected: restart only if process exits with a code not in exit_codes (default)
  #   - always:     always restart regardless of exit status
  #   - never:      never restart automatically
  autorestart: unexpected

  # Minimum continuous runtime (in seconds) before a process is considered RUNNING (default: 1)
  start_secs: 1

  # Maximum consecutive retry attempts when entering BACKOFF state (default: 3)
  start_retries: 3

  # Signal sent for graceful stop: TERM, INT, QUIT, KILL, CTRL_BREAK, CTRL_C
  # Default: TERM on Unix, CTRL_BREAK on Windows
  stop_signal: TERM

  # Grace period (in seconds) to wait for exit before force-killing (default: 10)
  stop_wait_secs: 10

  # Startup and shutdown priority: 0 to 99 (default: 50).
  # Lower priority values start first and stop last.
  priority: 50

  # Default logging parameters for program processes
  logs:
    # Set to false to disable all log capture/pumping for processes (spawns with null stdio)
    enabled: true
    max_bytes: "20MB"
    backups: 3
    redirect_stderr: false

# ------------------------------------------------------------------------------
# 4. Process Groups (Supervisor compatible)
# ------------------------------------------------------------------------------
# Organize multiple programs into named groups for batch status, start, stop,
# and restart operations (e.g. `supervisorctl start web:*`).
groups:
  web:
    programs:
      - api-server
    priority: 80

# ------------------------------------------------------------------------------
# 5. Supervised Programs
# ------------------------------------------------------------------------------
programs:

  # ----------------------------------------------------------------------------
  # Example 1: Infrastructure Service (Redis)
  # Low priority (starts first), always restarted, TCP health probe.
  # ----------------------------------------------------------------------------
  redis:
    command: "redis-server --port 6379 --protected-mode no"
    priority: 10
    autostart: true
    autorestart: always
    start_secs: 2

    # Active health checking probe
    health_check:
      type: tcp
      endpoint: "127.0.0.1:6379"
      interval_secs: 10
      timeout_secs: 2
      failure_threshold: 3

    logs:
      stdout: "logs/redis.log"
      redirect_stderr: true

  # ----------------------------------------------------------------------------
  # Example 2: Backend API Server
  # Depends on Redis, environment variable expansion, HTTP health check.
  # ----------------------------------------------------------------------------
  api-server:
    command: "./bin/api-server"
    args:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    priority: 20
    depends_on:
      - "redis"

    directory: "./services/api"
    # user: "www-data"   # Unix only: unprivileged user to execute process
    # umask: 022          # Unix file creation mode mask

    environment:
      APP_ENV: "production"
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:secret@127.0.0.1:5432/myapp}"
      REDIS_URL: "redis://127.0.0.1:6379"
      LOG_LEVEL: "info"

    autostart: true
    autorestart: unexpected
    start_secs: 5
    start_retries: 5
    stop_signal: TERM
    stop_wait_secs: 15
    exit_codes: [0]

    # HTTP health check probe
    health_check:
      type: http
      url: "http://127.0.0.1:8080/health"
      expected_status: 200
      interval_secs: 15
      timeout_secs: 3
      failure_threshold: 3
      initial_delay_secs: 5

    logs:
      stdout: "logs/api-server.log"
      stderr: "logs/api-server.err"
      max_bytes: "50MB"
      backups: 5

  # ----------------------------------------------------------------------------
  # Example 3: Background Worker
  # Depends on API server, Exec health check command, custom exit codes.
  # ----------------------------------------------------------------------------
  worker-task:
    command: "python3 worker.py --concurrency=4"
    priority: 30
    depends_on:
      - "api-server"

    environment:
      PYTHONUNBUFFERED: "1"
      WORKER_QUEUE: "critical,default,low"

    autorestart: unexpected
    exit_codes:
      - 0
      - 2

    stop_signal: TERM
    stop_wait_secs: 20

    # Exec health check probe: executes shell command, checks exit code == 0
    health_check:
      type: exec
      command: "python3 check_worker.py"
      interval_secs: 30
      timeout_secs: 5
      failure_threshold: 2

    logs:
      stdout: "logs/worker.log"
      redirect_stderr: true

  # ----------------------------------------------------------------------------
  # Example 4: Web Frontend Service
  # Higher priority (starts last in DAG), depends on API server.
  # ----------------------------------------------------------------------------
  web-frontend:
    command: "node server.js"
    priority: 40
    depends_on:
      - "api-server"

    directory: "./services/frontend"
    environment:
      PORT: "3000"
      API_BASE_URL: "http://127.0.0.1:8080"

    health_check:
      type: http
      url: "http://127.0.0.1:3000/api/health"
      expected_status: 200
      interval_secs: 15
      timeout_secs: 2

    logs:
      stdout: "logs/frontend.log"
      redirect_stderr: true

  # ----------------------------------------------------------------------------
  # Example 5: Scheduled Cron Job with Lifecycle Hooks
  # Schedules start and stop via cron expressions; executes hooks before start/stop.
  # ----------------------------------------------------------------------------
  nightly-backup:
    command: "python3 backup.py --all"
    # When cron is defined, autostart defaults to false (waits for cron trigger)
    autostart: false
    autorestart: unexpected

    # Cron schedule for start: standard 5-part POSIX crontab (e.g. 02:00 every day)
    cron: "0 2 * * *"
    # Optional cron schedule to automatically stop if still running (e.g. at 04:00)
    cron_stop: "0 4 * * *"

    # Lifecycle Hooks (compatible with Go supervisord pre_start_hook / pre_stop_hook):
    # Executed before child process starts. If exit code != 0, start is aborted
    # (unless pre_start_ignore_failure is set to true for degradation).
    pre_start: "sh -c 'echo Preparing backup directories...'"
    pre_start_ignore_failure: false

    # Executed before stopping the child process. If it fails or times out,
    # a warning and event are emitted, but stop degrades gracefully to ensure process termination.
    pre_stop: "sh -c 'echo Flushing backup locks...'"

    # Maximum duration (in seconds) permitted for hook execution before timeout (default: 15s)
    hook_timeout_secs: 15

    logs:
      stdout: "logs/backup.log"
      redirect_stderr: true

  # ----------------------------------------------------------------------------
  # Example 6: Hot-Reloading Microservice with Binary / Config Watcher
  # Automatically reloads or restarts when binary or configuration files change.
  # Compatible with Go ochinchina/supervisord extended directives.
  # ----------------------------------------------------------------------------
  microservice:
    command: "./bin/microservice --config ./config/service.json"
    priority: 50
    autostart: true
    autorestart: unexpected

    # Automatically watch executable binary and restart on update:
    restart_when_binary_changed: true

    # Optional graceful reload signal instead of full restart (e.g. SIGHUP):
    # restart_signal_when_binary_changed: SIGHUP

    # Or custom command to execute upon binary change:
    # restart_cmd_when_binary_changed: "systemctl reload myapp"

    # Monitor a configuration directory for changes:
    restart_directory_monitor: "./config"

    # Glob/wildcard pattern matching files within the monitored directory:
    restart_file_pattern: "*.json"

    # Signal or command to trigger when matching files change:
    restart_signal_when_file_changed: SIGHUP

    # Settling debounce window in seconds (default: 5).
    # Coalesces multi-chunk compiler writes and protects against lock conflicts.
    restart_debounce_secs: 5

    logs:
      stdout: "logs/microservice.log"
      redirect_stderr: true

